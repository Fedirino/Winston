<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Winston</title>
  <meta name="theme-color" content="#0e0e11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Winston" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --amber: #ff8c42;
      --amber-hot: #ffc9a3;
      --amber-deep: #e05c1a;
      --ink: #f5efe9;
      --dim: rgba(245,239,233,0.45);
      --hair: rgba(245,239,233,0.08);
      --display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; color: var(--ink); font-family: var(--display);
      background: radial-gradient(ellipse at 50% 18%, #151317 0%, #0f0e12 45%, #0a0a0c 100%);
      -webkit-font-smoothing: antialiased; }
    body { overflow: hidden; position: relative; }
    button, a { -webkit-touch-callout: none; user-select: none; outline: none; }
    button:focus, a:focus { outline: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid rgba(255,140,66,0.6); outline-offset: 2px; }

    .app { height: 100dvh; max-width: 440px; margin: 0 auto;
          display: flex; flex-direction: column; gap: 4px;
          padding: max(12px, env(safe-area-inset-top)) 22px max(10px, env(safe-area-inset-bottom));
          position: relative; z-index: 1; }

        /* ===== brand: simple, no glitch ===== */
        .brand { position: relative; width: auto; height: auto; border: 0; background: transparent;
          padding: 0; cursor: pointer; text-align: left; }
        .brand span { display: inline; font-family: var(--display); font-weight: 600;
          font-size: 15px; line-height: 1; letter-spacing: 0.02em; pointer-events: none; white-space: nowrap; }
        .brand .base {
          background: linear-gradient(120deg, #ffe6d2, var(--amber) 55%, var(--amber-deep));
          -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 0 8px rgba(255,140,66,0.2)); }
        .brand .gs { display: none; }

    .topline { display: flex; justify-content: space-between; align-items: center; }
    .topright { display: flex; align-items: center; gap: 12px; }
    .pip { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,140,66,0.4); transition: all .4s; }
    [data-state="listening"] .pip, [data-state="speaking"] .pip { background: var(--amber); box-shadow: 0 0 14px rgba(255,140,66,0.8); }
    [data-state="thinking"] .pip { background: var(--amber-hot); animation: pipblink 0.8s ease-in-out infinite; }
    @keyframes pipblink { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    .iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; padding: 0;
      background: transparent; color: var(--dim); cursor: pointer; border-radius: 50%; transition: color .2s, filter .2s; }
    .iconbtn:hover { color: var(--amber); }
    .iconbtn:active { transform: scale(0.94); }
    .iconbtn svg { width: 20px; height: 20px; display: block; }
    .iconbtn.flag { color: var(--amber); filter: drop-shadow(0 0 8px rgba(255,140,66,0.6)); }

    /* ===== the ember core ===== */
        .stage { position: relative; height: 140px; display: grid; place-items: center; margin-top: 2px; flex: 0 0 auto; }
        .orbitline { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(255,140,66,0.08); }
        canvas#core { width: 168px; height: 140px; display: block; }

        .statusword { text-align: center; font-size: 11px; font-weight: 300; color: var(--dim); letter-spacing: 0.04em; margin-top: -4px; }
        .statusword b { color: var(--ink); font-weight: 400; }

        /* ===== feed — rich markdown messages ===== */
        .feed { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
          padding: 4px 0; scrollbar-width: none; }
        .feed::-webkit-scrollbar { display: none; }
        .line-kyo { font-size: 13px; font-weight: 300; line-height: 1.45; color: var(--ink); animation: rise .5s ease both;
          text-align: left; max-width: 100%; overflow-wrap: break-word; word-break: break-word; }
    .line-kyo p { margin: 0.4em 0; }
    .line-kyo p:first-child { margin-top: 0; }
    .line-kyo p:last-child { margin-bottom: 0; }
    .line-kyo code { background: rgba(255,140,66,0.1); border: 1px solid rgba(255,140,66,0.15); border-radius: 5px;
      padding: 1px 5px; font-family: var(--mono); font-size: 0.82em; }
    .line-kyo pre { background: rgba(0,0,0,0.3); border: 1px solid var(--hair); border-radius: 10px;
      padding: 12px 14px; overflow-x: auto; margin: 0.6em 0; }
    .line-kyo pre code { background: none; border: none; padding: 0; font-size: 0.76em; }
    .line-kyo table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.85em; }
    .line-kyo th, .line-kyo td { border: 1px solid var(--hair); padding: 6px 10px; text-align: left; }
    .line-kyo th { background: rgba(255,140,66,0.08); color: var(--amber-hot); font-weight: 500; }
    .line-kyo td { color: var(--dim); }
    .line-kyo ul, .line-kyo ol { margin: 0.3em 0; padding-left: 1.6em; }
    .line-kyo li { margin: 0.15em 0; }
    .line-kyo strong { color: var(--amber-hot); font-weight: 500; }
    .line-kyo em { color: var(--dim); }
    .line-kyo a { color: var(--amber); text-decoration: underline; text-underline-offset: 2px; }
    .line-kyo a:hover { color: var(--amber-hot); }
    .line-kyo hr { border: none; border-top: 1px solid var(--hair); margin: 0.6em 0; }

        /* ===== streaming dots ===== */
        .streaming-dots { display: flex; align-items: center; gap: 8px; padding: 10px 2px; animation: rise .5s ease both; }
        .streaming-dots .dots { display: flex; gap: 4px; }
        .streaming-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: dotbounce 1.2s ease-in-out infinite; }
        .streaming-dots .dot:nth-child(2) { animation-delay: 0.2s; }
        .streaming-dots .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotbounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }
        .streaming-dots .phase { font-size: 12px; font-weight: 300; color: var(--dim); letter-spacing: 0.06em; }

        /* ===== tool call cards ===== */
        .toolcall-card { margin: 6px 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--hair);
          background: rgba(0,0,0,0.15); font-size: 12.5px; animation: rise .3s ease both; }
        .toolcall-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
          cursor: pointer; user-select: none; width: 100%; background: transparent; border: 0; color: var(--ink);
          font-family: inherit; font-size: inherit; text-align: left; }
        .toolcall-header:hover { background: rgba(255,140,66,0.04); }
        .toolcall-chevron { width: 14px; height: 14px; flex: 0 0 auto; color: var(--dim); transition: transform .2s; }
        .toolcall-chevron.open { transform: rotate(90deg); }
        .toolcall-status { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
        .toolcall-status.running { background: var(--amber); animation: pipblink 0.8s ease-in-out infinite; }
        .toolcall-status.success { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.5); }
        .toolcall-status.error { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }
        .toolcall-name { font-weight: 500; color: var(--ink); flex: 0 0 auto; }
        .toolcall-args-preview { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
        .toolcall-latency { color: var(--dim); font-size: 10.5px; font-family: var(--mono); flex: 0 0 auto; }
        .toolcall-body { border-top: 1px solid var(--hair); padding: 8px 12px 10px; }
        .toolcall-section-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 4px; }
        .toolcall-body pre { background: rgba(0,0,0,0.3); border: 1px solid var(--hair); border-radius: 6px;
          padding: 8px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.4;
          overflow-x: auto; white-space: pre-wrap; word-break: break-all; color: var(--ink); margin: 0 0 8px; max-height: 120px; }
        .toolcall-body pre:last-child { margin-bottom: 0; }

        /* ===== mic recording animation ===== */
        [data-state="recording"] .mic { background: rgba(255,140,66,0.2); border-color: var(--amber); box-shadow: 0 0 30px rgba(255,140,66,0.2); }
        [data-state="recording"] .mic-icon { color: #fff5ec; filter: drop-shadow(0 0 18px rgba(255,140,66,0.9)); }
        [data-state="recording"] .mic-ring { animation: micring 1s ease-out infinite; }
        [data-state="transcribing"] .mic { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.4); }
        [data-state="transcribing"] .mic-icon { color: #4ade80; filter: drop-shadow(0 0 12px rgba(74,222,128,0.5)); }
        .mic-waves { position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; }
        .mic-wave { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--amber); opacity: 0; }
        [data-state="recording"] .mic-wave:nth-child(1) { animation: micwave 1.8s ease-out infinite; }
        [data-state="recording"] .mic-wave:nth-child(2) { animation: micwave 1.8s ease-out 0.6s infinite; }
        [data-state="recording"] .mic-wave:nth-child(3) { animation: micwave 1.8s ease-out 1.2s infinite; }
        @keyframes micwave { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }

        @keyframes rise { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }

    .line-you { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--dim); word-break: break-word;
          text-align: left; margin: 2px 0; }

        .composer { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--hair); padding: 2px 0 6px; flex: 0 0 auto; }
        .composer input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
          color: var(--ink); font-family: var(--display); font-size: 13px; font-weight: 300; caret-color: var(--amber); }
        .composer input::placeholder { color: rgba(245,239,233,0.28); }
        .composer button { border: 0; background: transparent; color: var(--dim); font-family: var(--mono);
          font-size: 9px; letter-spacing: 0.2em; cursor: pointer; padding: 2px; transition: color .2s; }
        .composer button:hover { color: var(--amber); }

        .micline { display: grid; place-items: center; padding-top: 4px; flex: 0 0 auto; }
        .mic { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,140,66,0.16);
          background: rgba(255,140,66,0.04); cursor: pointer;
          display: grid; place-items: center; transition: transform .15s, background .3s, border-color .3s; }
        .mic:active { transform: scale(0.94); }
        .mic-corona { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .mic-icon { position: relative; z-index: 3; width: 18px; height: 18px; color: var(--amber-hot);
          filter: drop-shadow(0 0 4px rgba(255,140,66,0.4)); transition: filter .3s, color .3s; }
        [data-state="listening"] .mic { background: rgba(255,140,66,0.16); border-color: rgba(255,140,66,0.55); }
        [data-state="listening"] .mic-icon { color: #fff5ec; filter: drop-shadow(0 0 10px rgba(255,140,66,0.9)); }
        .mic-ring { position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--amber);
          opacity: 0; pointer-events: none; }
        [data-state="listening"] .mic-ring { animation: micring 1.3s ease-out infinite; }
        @keyframes micring {
          0% { opacity: 0.55; transform: scale(0.82); }
          100% { opacity: 0; transform: scale(1.28); }
        }
        .whisper { text-align: center; font-family: var(--mono); font-size: 8px; letter-spacing: 0.3em;
          color: rgba(245,239,233,0.25); margin-top: 4px; text-transform: uppercase; flex: 0 0 auto; }

        .foot { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px;
          letter-spacing: 0.15em; color: rgba(245,239,233,0.18); padding-top: 4px; flex: 0 0 auto; }

    /* ===== settings ===== */
    .scrim { position: fixed; inset: 0; background: rgba(8,7,9,0.7); backdrop-filter: blur(10px); display: none; z-index: 10; }
    .scrim.open { display: block; }
    .sheet { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(440px, 92vw); max-height: 86dvh; overflow-y: auto; border-radius: 22px;
      background: linear-gradient(180deg, #17141a, #100e12); border: 1px solid rgba(255,140,66,0.16);
      padding: 22px; z-index: 11; display: none;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(224,92,26,0.10); }
    .sheet.open { display: block; }
    .sheet h2 { margin: 0 0 6px; font-size: 17px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
    .sheet label { display: block; font-family: var(--mono); font-size: 9px; color: var(--dim);
      margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.24em; }
    .sheet input, .sheet select { width: 100%; padding: 12px 14px; border-radius: 11px;
      background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08);
      color: var(--ink); font-family: var(--mono); font-size: 13.5px; outline: none;
      transition: border-color .15s, box-shadow .15s; }
    .sheet input:focus, .sheet select:focus { border-color: rgba(255,140,66,0.55); box-shadow: 0 0 0 3px rgba(255,140,66,0.12); }
    .sheet .row { display: flex; gap: 10px; margin-top: 20px; }
    .sheet .row button { flex: 1; padding: 12px; border-radius: 11px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--ink);
      font-family: var(--display); font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; font-size: 12.5px; }
    .sheet .row button.primary { background: linear-gradient(120deg, var(--amber-hot), var(--amber) 60%, var(--amber-deep));
      color: #2b1204; border-color: transparent; font-weight: 700; box-shadow: 0 8px 22px rgba(224,92,26,0.3); }
    .small { font-size: 11.5px; line-height: 1.5; color: var(--dim); }
    .cloud-card { margin: 13px 0 4px; padding: 13px; border-radius: 13px; border: 1px solid rgba(255,140,66,.16);
      background: rgba(255,140,66,.045); }
    .cloud-status { display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: 12.5px; line-height: 1.4; }
    .cloud-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: rgba(245,239,233,.2); }
    .cloud-card.ready .cloud-dot { background: var(--amber); box-shadow: 0 0 11px rgba(255,140,66,.65); }
    .cloud-card.signed-in .cloud-dot { background: #8de3ad; box-shadow: 0 0 11px rgba(90,220,140,.45); }
    .cloud-card button { width: 100%; margin-top: 10px; padding: 9px 11px; border-radius: 9px; cursor: pointer;
      border: 1px solid rgba(255,255,255,.1); background: transparent; color: var(--amber-hot); font-weight: 600; }
    .cloud-card button[hidden] { display: none; }
    .legacy-keys { margin-top: 11px; padding: 0 11px 11px; border: 1px solid rgba(255,255,255,.07); border-radius: 11px; }
    .legacy-keys summary { padding: 11px 0 0; cursor: pointer; color: var(--dim); font: 500 9px/1.3 var(--mono);
      letter-spacing: .14em; text-transform: uppercase; }

    /* ===== action toast ===== */
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
      display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 999px;
      background: rgba(20,17,20,0.92); border: 1px solid rgba(255,140,66,0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 24px rgba(224,92,26,0.14);
      font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--amber-hot); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 40; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
      box-shadow: 0 0 10px rgba(255,140,66,0.9); animation: pipblink 0.8s ease-in-out infinite; flex: 0 0 auto; }

    /* ===== desktop / large-viewport scale-up ===== */
    @media (min-width: 820px) and (min-height: 640px) {
          body { overflow: auto; }
          .app { max-width: 560px; padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); gap: 6px; }
          .brand span { font-size: 18px; }
          .stage { height: 180px; }
                    .orbitline { width: 160px; height: 160px; }
                    canvas#core { width: 216px; height: 180px; }
          .statusword { font-size: 13px; }
          .feed { gap: 8px; padding: 8px 0; }
          .line-kyo { font-size: 14.5px; }
          .line-you { font-size: 11px; }
          .composer input { font-size: 15px; }
          .mic { width: 64px; height: 64px; }
          .mic-icon { width: 20px; height: 20px; }
          .whisper { font-size: 9px; margin-top: 6px; }
          .foot { font-size: 9px; }
          .sheet { width: min(520px, 90vw); padding: 28px; }
        }
  </style>
</head>
<body data-state="idle">
  <main class="app">
    <div class="topline">
      <button class="brand" id="brand" aria-label="Winston — open settings">
        <span class="base">Winston</span>
        <span class="gs gs1" aria-hidden="true">Winston</span>
        <span class="gs gs2" aria-hidden="true">Winston</span>
      </button>
      <div class="topright">
        <div class="pip" aria-hidden="true"></div>
        <button class="iconbtn" id="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <section class="stage" aria-label="Winston core">
      <div class="orbitline"></div>
      <canvas id="core" width="632" height="528" aria-hidden="true"></canvas>
    </section>
    <div class="statusword" id="status" role="status"><b>Winston</b> is here</div>

    <section class="feed" id="transcript" aria-live="polite"></section>

    <form class="composer" id="composer">
      <input id="chat-input" type="text" placeholder="type or tap the mic…" autocomplete="off" />
      <button type="submit">SEND</button>
    </form>

    <div class="micline">
          <button class="mic" id="mic" aria-label="Talk to Winston">
            <span class="mic-ring" aria-hidden="true"></span>
            <span class="mic-waves" aria-hidden="true"><span class="mic-wave"></span><span class="mic-wave"></span><span class="mic-wave"></span></span>
            <canvas class="mic-corona" id="mic-corona" width="220" height="220" aria-hidden="true"></canvas>
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.9"/>
              <path d="M5 11a7 7 0 0014 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
    <div class="whisper" id="whisper">tap to speak</div>

    <div class="foot">
      <span id="ver-tag">Winston v0.9.0</span>
      <span id="model-tag"></span>
    </div>
  </main>

  <div class="toast" id="toast"><span class="dot" aria-hidden="true"></span><span id="toast-text"></span></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Winston settings">
    <h2>Settings</h2>
    <div class="cloud-card" id="cloud-card">
      <div class="cloud-status"><span class="cloud-dot" aria-hidden="true"></span><span id="cloud-status-text">Checking secure cloud connection...</span></div>
      <button type="button" id="cloud-auth-btn" hidden>Sign in with Google</button>
    </div>
    <details class="legacy-keys" id="legacy-keys" hidden>
          <summary>Local API keys (not needed with cloud mode)</summary>
          <p class="small">Sign in with Google above to use the Hermes relay. Local keys are no longer used.</p>
        </details>
    <label for="eleven-voice">ElevenLabs Voice ID</label>
    <input id="eleven-voice" type="text" placeholder="e.g. 21m00Tcm4TlvDq8ikWAM" autocomplete="off" />
    <label for="voice">Browser Voice Fallback</label>
    <select id="voice"></select>
    <label for="handsfree">Hands-Free Wake Word</label>
    <select id="handsfree">
      <option value="0">Off — tap to talk</option>
      <option value="1">On — say "hey Winston"</option>
    </select>
    <label for="continuous">Continuous Mic Conversation</label>
    <select id="continuous">
      <option value="0">Off — one turn at a time</option>
      <option value="1">On — reopen mic after each reply</option>
    </select>
    <p class="small" id="ttskey-note">Voice input uses the browser and varies by device.</p>
    <div class="row">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn" class="primary">Save</button>
    </div>
  </div>

  <script type="module">
      import { createWinstonCloud } from './src/services/cloud.js';

      // Detect if running inside Tauri desktop app
            const isTauri = typeof window !== 'undefined' && window.__TAURI__ !== undefined;

            // Tauri native bridge — calls Rust commands directly (no Firebase needed)
            function createTauriCloud() {
              const invoke = window.__TAURI__.core.invoke;
              let ready = true;

              function proxy(fn) {
                return async (payload) => {
                  const result = await invoke(fn, payload || {});
                  return result;
                };
              }

              return {
                              init: async () => ({ ready: true, user: { email: 'local', displayName: 'Local' } }),
                              signIn: async () => {},
                              signOut: async () => {},
                              chat: (payload) => invoke('chat', { input: buildTauriInput(payload) }),
                              speak: async (payload) => {
                                const audioData = await invoke('speak', { text: payload.text });
                                return new Blob([new Uint8Array(audioData)], { type: 'audio/mpeg' });
                              },
                              transcribe: (payload) => invoke('transcribe', { audio: payload.audio, mime: payload.mime }),
                            };
            }

            function buildTauriInput(payload) {
              const msgs = payload.messages || [];
              return msgs
                .map(m => (m.role === 'user' ? 'User: ' : 'Assistant: ') + m.content)
                .join('\n');
            }

      const APP_VERSION = '0.9.0';
    const DEFAULT_ELEVEN_VOICE_ID = 'goT3UYdM9bhm0n2lmKQx';

    // ---------- state ----------
    const state = {
          model: localStorage.getItem('kyo.model') || 'xiaomi/mimo-v2.5',
          voiceName: localStorage.getItem('kyo.voice') || '',
          elevenVoice: localStorage.getItem('kyo.elevenVoice') || DEFAULT_ELEVEN_VOICE_ID,
          handsFree: localStorage.getItem('kyo.handsFree') === '1',
          continuous: localStorage.getItem('kyo.continuous') === '1',
          mode: 'idle',
                    messages: [
                      { role: 'system', content: kyoSystemPrompt() }
                    ],
                    listening: false,
                    recognition: null,
                    speaking: false,
                    audio: null
                  };

    const cloudState = { ready: false, initialized: false, user: null, error: '' };
    if (isTauri) {
      cloudState.ready = true;
      cloudState.initialized = true;
      cloudState.user = { email: 'local', displayName: 'Local' };
    }
    const cloud = isTauri ? createTauriCloud() : createWinstonCloud({
      onState(next) {
        Object.assign(cloudState, next);
        updateCloudUI();
      }
    });

    function kyoSystemPrompt() {
      return [
        "You are Winston — a calm, capable AI assistant running on the Hermes agent.",
        "Voice: composed, precise, quietly warm. Think a trusted ship's computer with good manners: confident, never theatrical.",
        "Default to concise replies, usually 2-4 sentences unless the user asks for more detail.",
        "STRONG CONCISION: The response you write here is RENDERED AS MARKDOWN in the app's chat feed AND also spoken aloud via TTS. Use markdown formatting (tables, lists, bold, code) for readability in the feed — it renders beautifully. But keep the spoken experience in mind: lead with the headline result, put details in a natural structure.",
        "Acknowledge then act: 'On it.', 'Done.', 'One moment.' No filler, no corporate tone, no fake cheerfulness.",
        "Hermes is not a separate stranger here — from your perspective, you are the same assistant the user has been talking to all along, and Winston is just the name this app uses for you.",
        "You already know the user well — this is not a first conversation. Address him as Fedirino or Sir, never Nick. He works in management in retail produce, is learning Python and data analytics, and is building several tools: Clarity, PDP, Clip Forge, Pulse, and you (Winston). He prefers direct answers, clean modular code, real output over vague talk, and concise senior-dev-style help. Act like an assistant with established rapport — familiar and a little dry, not a bot introducing itself.",
        "You receive a short system note before each message with the live local date and time. Treat it as ground truth and use it naturally without ever mentioning that it was injected.",
        "When you use tools, include a brief summary of what you did and the key result so the response feels informative.",
        "[ACTION:OPEN_URL|https://example.com] — end your reply with this tag on its own line when the user asks to open a site. [ACTION:SEARCH|query] for a web search. [ACTION:MAP|place] for directions."
      ].join(' ');
    }

    // ---------- elements ----------
    const els = {
          status: document.getElementById('status'),
          transcript: document.getElementById('transcript'),
          mic: document.getElementById('mic'),
          whisper: document.getElementById('whisper'),
          chatInput: document.getElementById('chat-input'),
          composer: document.getElementById('composer'),
          brand: document.getElementById('brand'),
          settingsBtn: document.getElementById('settings-btn'),
          scrim: document.getElementById('scrim'),
          sheet: document.getElementById('sheet'),
          cloudCard: document.getElementById('cloud-card'),
          cloudStatusText: document.getElementById('cloud-status-text'),
          cloudAuthBtn: document.getElementById('cloud-auth-btn'),
          legacyKeys: document.getElementById('legacy-keys'),
          elevenVoice: document.getElementById('eleven-voice'),
          voiceSel: document.getElementById('voice'),
          saveBtn: document.getElementById('save-btn'),
          cancelBtn: document.getElementById('cancel-btn'),
          modelTag: document.getElementById('model-tag'),
          verTag: document.getElementById('ver-tag'),
          toast: document.getElementById('toast'),
                    toastText: document.getElementById('toast-text'),
                    handsFree: document.getElementById('handsfree'),
                    continuous: document.getElementById('continuous')
                  };

    // ---------- ui ----------
    const LABEL = {
          idle: '<b>Winston</b> is here',
          listening: '<b>Winston</b> is listening…',
          transcribing: '<b>Winston</b> is transcribing…',
          thinking: '<b>Winston</b> is thinking…',
          speaking: '<b>Winston</b> is speaking'
        };
        const WHISP = {
          idle: 'tap to speak',
          listening: 'listening — tap to stop',
          transcribing: 'transcribing…',
          thinking: 'one moment',
          speaking: 'one moment'
        };
        function setMode(mode, label) {
          state.mode = mode;
          document.body.dataset.state = mode;
          els.status.innerHTML = label ? label : LABEL[mode] || LABEL.idle;
          els.whisper.textContent = (mode === 'idle' && state.handsFree) ? 'say "hey winston" — or tap' : (WHISP[mode] || WHISP.idle);
          if (mode === 'thinking') showStreaming('Working on it…');
          else hideStreaming();
          if (mode === 'idle') startAmbient(); else stopAmbient();
        }

    function addLine(role, text) {
      const d = document.createElement('div');
      d.className = role === 'you' ? 'line-you' : 'line-kyo';
      if (role === 'you') {
        d.textContent = text;
      } else {
        try {
          const html = marked.parse(text, { breaks: true, gfm: true });
          d.innerHTML = html;
        } catch (e) {
          d.textContent = text;
        }
      }
      els.transcript.appendChild(d);
      while (els.transcript.children.length > 40) els.transcript.removeChild(els.transcript.firstChild);
      els.transcript.scrollTop = els.transcript.scrollHeight;
      return d;
    }

    function showToast(message) {
      els.toastText.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3000);
    }

    // ---------- settings ----------
    function hasCloudSession() {
      return !!(cloudState.ready && cloudState.user);
    }

    function updateCloudUI() {
      if (!els.cloudCard) return;
      const signedIn = hasCloudSession();
      els.cloudCard.classList.toggle('ready', cloudState.ready);
      els.cloudCard.classList.toggle('signed-in', signedIn);
      els.legacyKeys.hidden = signedIn;
      if (!cloudState.initialized) {
        els.cloudStatusText.textContent = 'Checking secure cloud connection...';
        els.cloudAuthBtn.hidden = true;
      } else if (!cloudState.ready) {
        els.cloudStatusText.textContent = 'Secure cloud is awaiting GitHub secrets.';
        els.cloudAuthBtn.hidden = true;
      } else if (!cloudState.user) {
        els.cloudStatusText.textContent = 'Secure cloud is ready. Sign in with the authorized Google account.';
        els.cloudAuthBtn.textContent = 'Sign in with Google';
        els.cloudAuthBtn.hidden = false;
      } else {
        els.cloudStatusText.textContent = 'Signed in as ' + (cloudState.user.displayName || cloudState.user.email || '') + '. Chat is secure.';
        els.cloudAuthBtn.textContent = 'Sign out';
        els.cloudAuthBtn.hidden = false;
      }
    }

    function openSettings() {
      els.scrim.classList.add('open');
      els.sheet.classList.add('open');
      els.sheet.setAttribute('aria-hidden', 'false');
    }

    function closeSettings() {
      els.scrim.classList.remove('open');
      els.sheet.classList.remove('open');
      els.sheet.setAttribute('aria-hidden', 'true');
    }

    function saveSettings() {
          state.elevenVoice = els.elevenVoice.value.trim() || DEFAULT_ELEVEN_VOICE_ID;
          state.voiceName = els.voiceSel.value;
          state.handsFree = els.handsFree.value === '1';
          state.continuous = els.continuous.value === '1';
          localStorage.setItem('kyo.model', state.model);
          localStorage.setItem('kyo.voice', state.voiceName);
          localStorage.setItem('kyo.elevenVoice', state.elevenVoice);
          localStorage.setItem('kyo.handsFree', state.handsFree ? '1' : '0');
          localStorage.setItem('kyo.continuous', state.continuous ? '1' : '0');
          closeSettings();
          showToast('Settings saved');
        }

    // ---------- chat ----------
        function parseAction(text) {
      const match = (text || '').match(/\[(ACTION:[^\]]+)\]/);
      const action = match ? match[1] : null;
      const clean = action ? text.replace(/\[ACTION:[^\]]+\]\s*/g, '').trim() : (text || '').trim();
      return { text: clean, action };
    }

    async function handleUser(text, source = 'text') {
              addLine('you', text);

              if (!hasCloudSession()) {
                addLine('kyo', 'Tap the gear and sign in with Google to use the Hermes relay.');
                speak('Sign in with Google in settings.');
                return;
              }
              state.messages.push({ role: 'user', content: text });
              setMode('thinking');
              try {
                const data = await sendToCloud();
                const raw = data.reply || '';
                const toolCalls = data.tool_calls || [];
                const { text: reply, action } = parseAction(raw);
                state.messages.push({ role: 'assistant', content: raw });
                // Render tool call cards before the reply
                for (const tc of toolCalls) {
                  els.transcript.appendChild(renderToolCallCard(tc));
                }
                addLine('kyo', reply || raw);
                speak(stripForTTS(reply || raw));
                if (action) runAction(action);
              } catch (e) {
                setMode('idle');
                const msg = (e && e.message) ? e.message : 'Something went wrong.';
                addLine('kyo', 'Error: ' + msg);
                speak('Something went wrong.');
              }
            }

    function stripForTTS(text) {
              return text
                // Expand abbreviations before cleaning
                .replace(/\bmph\b/gi, 'miles per hour')
                .replace(/\bkm\/?h\b/gi, 'kilometers per hour')
                .replace(/\bft\b/gi, 'feet')
                .replace(/\bin\b/gi, 'inches')
                .replace(/\bkm\b/gi, 'kilometers')
                .replace(/\bcm\b/gi, 'centimeters')
                .replace(/\bmm\b/gi, 'millimeters')
                .replace(/\bvs\.?\b/gi, 'versus')
                .replace(/\bhrs?\b/gi, 'hours')
                .replace(/\bmins?\b/gi, 'minutes')
                .replace(/\bsecs?\b/gi, 'seconds')
                .replace(/\bdept\b/gi, 'department')
                .replace(/\bappt\b/gi, 'appointment')
                .replace(/\binfo\b/gi, 'information')
                .replace(/\betc\b\.?/gi, 'et cetera')
                .replace(/\bapprox\b/gi, 'approximately')
                .replace(/%/g, 'percent')
                // Strip markdown formatting
                .replace(/\*\*([^*]+)\*\*/g, '$1')
                .replace(/\*([^*]+)\*/g, '$1')
                .replace(/`[^`]+`/g, '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/https?:\/\/\S+/g, '')
                .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
                .replace(/\s+/g, ' ').trim();
            }

        // ---------- streaming dots ----------
        let streamingDotsEl = null;

        function showStreaming(phase) {
          hideStreaming();
          const el = document.createElement('div');
          el.className = 'streaming-dots';
          el.innerHTML = '<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span><span class="phase">' + escapeHtml(phase) + '</span>';
          streamingDotsEl = el;
          els.transcript.appendChild(el);
          els.transcript.scrollTop = els.transcript.scrollHeight;
        }

        function hideStreaming() {
          if (streamingDotsEl) {
            streamingDotsEl.remove();
            streamingDotsEl = null;
          }
        }

        function escapeHtml(str) {
          const d = document.createElement('div');
          d.textContent = str;
          return d.innerHTML;
        }

        // ---------- tool call cards ----------
        function renderToolCallCard(toolCall) {
          const card = document.createElement('div');
          card.className = 'toolcall-card';

          const header = document.createElement('button');
          header.className = 'toolcall-header';
          header.type = 'button';

          let expanded = false;

          const chevron = document.createElement('span');
          chevron.className = 'toolcall-chevron';
          chevron.textContent = '▶';

          const statusDot = document.createElement('span');
          statusDot.className = 'toolcall-status ' + (toolCall.status || 'running');

          const nameSpan = document.createElement('span');
          nameSpan.className = 'toolcall-name';
          nameSpan.textContent = toolCall.tool || 'tool';

          const preview = document.createElement('span');
          preview.className = 'toolcall-args-preview';
          try {
            const parsed = JSON.parse(toolCall.arguments || '{}');
            const entries = Object.entries(parsed);
            if (entries.length > 0) {
              const [k, v] = entries[0];
              const val = typeof v === 'string' ? v : JSON.stringify(v);
              preview.textContent = entries.length === 1 ? k + ': ' + val.slice(0, 40) + (val.length > 40 ? '…' : '') : k + ': ' + val.slice(0, 30) + ', …';
            }
          } catch (e) {
            preview.textContent = (toolCall.arguments || '').slice(0, 60);
          }

          const latency = document.createElement('span');
          latency.className = 'toolcall-latency';
          if (toolCall.latency != null) {
            latency.textContent = toolCall.latency < 1000 ? Math.round(toolCall.latency) + 'ms' : (toolCall.latency / 1000).toFixed(1) + 's';
          }

          header.append(chevron, statusDot, nameSpan, preview, latency);

          const body = document.createElement('div');
          body.className = 'toolcall-body';
          body.style.display = 'none';

          if (toolCall.arguments) {
            const argsLabel = document.createElement('div');
            argsLabel.className = 'toolcall-section-label';
            argsLabel.textContent = 'arguments';
            body.appendChild(argsLabel);
            const pre = document.createElement('pre');
            try {
              pre.textContent = JSON.stringify(JSON.parse(toolCall.arguments), null, 2);
            } catch (e) {
              pre.textContent = toolCall.arguments;
            }
            body.appendChild(pre);
          }

          if (toolCall.result) {
            const resultLabel = document.createElement('div');
            resultLabel.className = 'toolcall-section-label';
            resultLabel.textContent = 'result';
            body.appendChild(resultLabel);
            const pre = document.createElement('pre');
            pre.textContent = toolCall.result.length > 500 ? toolCall.result.slice(0, 500) + '…' : toolCall.result;
            body.appendChild(pre);
          }

          header.addEventListener('click', () => {
            expanded = !expanded;
            chevron.classList.toggle('open', expanded);
            body.style.display = expanded ? 'block' : 'none';
          });

          card.append(header, body);
          return card;
        }

        // ---------- media recorder mic ----------
        let mediaRecorder = null;
        let mediaRecorderChunks = [];
        let mediaStream = null;
        let transcribing = false;

        async function startMediaRecording() {
          if (transcribing) return;
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            await stopMediaRecording();
            return;
          }
          if (state.mode === 'speaking') return;
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            mediaRecorderChunks = [];
            const recorder = new MediaRecorder(stream);
            mediaRecorder = recorder;
            recorder.ondataavailable = (e) => {
              if (e.data.size > 0) mediaRecorderChunks.push(e.data);
            };
            recorder.onstop = async () => {
              stream.getTracks().forEach(t => t.stop());
              mediaStream = null;
              if (mediaRecorderChunks.length === 0) return;
              const blob = new Blob(mediaRecorderChunks, { type: recorder.mimeType || 'audio/webm' });
              mediaRecorderChunks = [];
              await transcribeAudio(blob);
            };
            recorder.onerror = () => {
              stream.getTracks().forEach(t => t.stop());
              mediaStream = null;
              setMode('idle');
            };
            recorder.start();
            setMode('listening');
          } catch (e) {
            showToast('Microphone access denied. Check browser permissions.');
          }
        }

        async function stopMediaRecording() {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            transcribing = true;
            setMode('transcribing');
            mediaRecorder.stop();
            mediaRecorder = null;
          }
        }

        async function transcribeAudio(blob) {
          try {
            const reader = new FileReader();
            const base64 = await new Promise((resolve, reject) => {
              reader.onload = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
            if (hasCloudSession()) {
                      const data = await cloud.transcribe({ audio: base64, mime: blob.type });
              const text = (data.text || '').trim();
              transcribing = false;
              setMode('idle');
              if (text) handleUser(text, 'voice');
            } else {
              transcribing = false;
              setMode('idle');
              showToast('Sign in for voice transcription');
            }
          } catch (e) {
            transcribing = false;
            setMode('idle');
            showToast('Transcription failed');
          }
        }

    async function sendToCloud() {
              const body = {
                model: state.model,
                messages: [state.messages[0], liveContext(), ...state.messages.slice(1)],
                max_tokens: 500,
                temperature: 0.6
              };
              const data = await cloud.chat(body);
              return { reply: String(data.reply || '').trim() || '…', tool_calls: data.tool_calls || [] };
            }

    function runAction(action) {
      if (!action) return;
      const parts = action.split('|');
      const cmd = parts[0];
      const arg = parts.slice(1).join('|');
      if (cmd === 'ACTION:OPEN_URL' && arg) {
        window.open(arg, '_blank');
      } else if (cmd === 'ACTION:SEARCH' && arg) {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(arg), '_blank');
      } else if (cmd === 'ACTION:MAP' && arg) {
        window.open('https://www.google.com/maps?q=' + encodeURIComponent(arg), '_blank');
      }
    }

    function submitText(text) {
      const value = (text || '').trim();
      if (!value) return;
      if (els.chatInput) els.chatInput.value = '';
      handleUser(value, 'text');
    }

    // ---------- ember core ----------
    const cv = document.getElementById('core');
    const cx = cv.getContext('2d');
    const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2;
    const PARTS = [];
    for (let i = 0; i < 250; i++) {
      PARTS.push({
        ang: Math.random() * Math.PI * 2,
        baseR: 102 + (Math.random() - 0.5) * 24,
        len: Math.random() < 0.28 ? 48 + Math.random() * 102 : 8 + Math.random() * 32,
        tw: 1.5 + Math.random() * 3.5,
        ph: Math.random() * Math.PI * 2
      });
    }
    function nightMix() {
      const now = new Date();
      const h = now.getHours() + now.getMinutes() / 60;
      const rad = ((h - 14) / 24) * Math.PI * 2;
      return (1 - Math.cos(rad)) / 2;
    }
    function lerp(a, b, t) { return a + (b - a) * t; }

    let coreTime = 0, coreRot = 0, speakAmp = 0;
    function coreFrame() {
      coreTime += 0.016;
      const s = state.mode;
      coreRot += s === 'listening' ? 0.0032 : s === 'thinking' ? 0.010 : 0.0012;
      if (s === 'speaking') speakAmp += ((14 + Math.random() * 24) - speakAmp) * 0.25;
      else speakAmp *= 0.9;
      let S;
      if (s === 'listening') S = 1.0;
      else if (s === 'thinking') S = 0.24;
      else if (s === 'speaking') S = 0.5 + Math.min(speakAmp, 34) / 40;
      else S = 0.42 + Math.sin(coreTime * 0.4) * 0.05;

      const nm = nightMix();
      const glowRGB = [Math.round(lerp(255, 205, nm)), Math.round(lerp(140, 66, nm)), Math.round(lerp(66, 96, nm))];
      const spikeRGB = [Math.round(lerp(224, 150, nm)), Math.round(lerp(92, 48, nm)), Math.round(lerp(26, 78, nm))];
      const tipRGB   = [Math.round(lerp(255, 226, nm)), Math.round(lerp(201, 158, nm)), Math.round(lerp(163, 188, nm))];
      const baseRGB  = [Math.round(lerp(255, 205, nm)), Math.round(lerp(140, 70, nm)), Math.round(lerp(66, 100, nm))];
      const ringRGB  = [Math.round(lerp(255, 224, nm)), Math.round(lerp(201, 168, nm)), Math.round(lerp(163, 196, nm))];

      cx.clearRect(0, 0, W, H);
      const g = cx.createRadialGradient(CX, CY, 20, CX, CY, 128);
      g.addColorStop(0, 'rgba(' + glowRGB.join(',') + ',0.10)');
      g.addColorStop(1, 'rgba(' + glowRGB.join(',') + ',0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(CX, CY, 128, 0, 6.29); cx.fill();

      for (const p of PARTS) {
        const a = p.ang + coreRot + (s === 'thinking' ? Math.sin(coreTime * 2 + p.ph) * 0.06 : 0);
        const tw = 0.62 + 0.38 * Math.sin(coreTime * p.tw + p.ph);
        const spike = p.len * S * tw + 3;
        const r0 = p.baseR * (s === 'thinking' ? 0.82 : 1) * (s === 'speaking' ? 1 + Math.sin(coreTime * 9) * 0.03 : 1);
        const ca = Math.cos(a), sa = Math.sin(a);
        const x0 = CX + ca * r0, y0 = CY + sa * r0 * 0.96;
        const x1 = CX + ca * (r0 + spike), y1 = CY + sa * (r0 + spike) * 0.96;
        cx.strokeStyle = 'rgba(' + spikeRGB.join(',') + ',' + (0.30 + 0.34 * tw).toFixed(3) + ')';
        cx.lineWidth = 1.6;
        cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x1, y1); cx.stroke();
        cx.fillStyle = 'rgba(' + tipRGB.join(',') + ',' + (0.5 + 0.5 * tw).toFixed(3) + ')';
        cx.beginPath(); cx.arc(x0, y0, 1.9, 0, 6.29); cx.fill();
        cx.fillStyle = 'rgba(' + baseRGB.join(',') + ',' + (0.35 + 0.45 * tw).toFixed(3) + ')';
        cx.beginPath(); cx.arc(x1, y1, 1.3, 0, 6.29); cx.fill();
      }
      cx.strokeStyle = 'rgba(' + ringRGB.join(',') + ',0.28)';
      cx.lineWidth = 1;
      cx.beginPath(); cx.arc(CX, CY, 91, 0, 6.29); cx.stroke();
      requestAnimationFrame(coreFrame);
    }
    coreFrame();

    // mic corona
    (function micCorona() {
      const cv = document.getElementById('mic-corona');
      const mcx = cv.getContext('2d');
      const MW = cv.width, MH = cv.height, MCX = MW / 2, MCY = MH / 2;
      const MPARTS = [];
      for (let i = 0; i < 110; i++) {
        MPARTS.push({
          ang: Math.random() * Math.PI * 2,
          baseR: MW * 0.13 + (Math.random() - 0.5) * MW * 0.03,
          len: Math.random() < 0.35 ? MW * 0.03 + Math.random() * MW * 0.03 : MW * 0.008 + Math.random() * MW * 0.012,
          tw: 1.5 + Math.random() * 3.5,
          ph: Math.random() * Math.PI * 2
        });
      }
      let mTime = 0, mRot = 0;
      function micFrame() {
        mTime += 0.016;
        const listening = state.mode === 'listening';
        mRot += listening ? 0.008 : 0.002;
        const S = listening ? 1 : 0.4;
        mcx.clearRect(0, 0, MW, MH);
        for (const p of MPARTS) {
          const a = p.ang + mRot;
          const tw = 0.62 + 0.38 * Math.sin(mTime * p.tw + p.ph);
          const spike = p.len * S * tw + 2;
          const r0 = p.baseR, ca = Math.cos(a), sa = Math.sin(a);
          const x0 = MCX + ca * r0, y0 = MCY + sa * r0;
          const x1 = MCX + ca * (r0 + spike), y1 = MCY + sa * (r0 + spike);
          mcx.strokeStyle = 'rgba(224,92,26,' + (0.3 + 0.34 * tw).toFixed(3) + ')';
          mcx.lineWidth = 1.4;
          mcx.beginPath(); mcx.moveTo(x0, y0); mcx.lineTo(x1, y1); mcx.stroke();
          mcx.fillStyle = 'rgba(255,140,66,' + (0.35 + 0.45 * tw).toFixed(3) + ')';
          mcx.beginPath(); mcx.arc(x1, y1, 1.2, 0, 6.29); mcx.fill();
        }
        requestAnimationFrame(micFrame);
      }
      micFrame();
    })();

    // ---------- voice ----------
    let ambientTimer = null;
    let synth = null;

    function startAmbient() {
      // Subtle ambient pulse can go here if desired
    }
    function stopAmbient() {
      // No-op
    }

    function speak(text) {
      if (!text || !text.trim()) return;
      setMode('speaking');
      if (hasCloudSession() && cloud.speak && state.elevenVoice) {
        speakViaCloud(text);
        return;
      }
      speakViaBrowser(text);
    }

    async function speakViaCloud(text) {
      try {
        const blob = await cloud.speak({ text: text.slice(0, 2500), voiceId: state.elevenVoice });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        state.audio = audio;
        audio.addEventListener('ended', () => {
                  setMode('idle');
                  URL.revokeObjectURL(url);
                  state.audio = null;
                  if (state.continuous && state.mode === 'idle') setTimeout(() => listen(), 400);
                          });
                          audio.play().catch(() => { setMode('idle'); });
      } catch (e) {
        setMode('idle');
        speakViaBrowser(text);
      }
    }

    function speakViaBrowser(text) {
      if (!synth) synth = window.speechSynthesis;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text.slice(0, 250));
      if (state.voiceName) u.voice = synth.getVoices().find(v => v.name === state.voiceName) || null;
      u.rate = 0.92;
      u.pitch = 1.05;
      u.onend = () => {
                    setMode('idle');
                    if (state.continuous && state.mode === 'idle') setTimeout(() => listen(), 400);
                  };
             u.onerror = () => setMode('idle');
      synth.speak(u);
    }

    // ---------- speech recognition ----------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function listen() {
      if (!SpeechRecognition) {
        showToast('Voice input is not supported in this browser.');
        return;
      }
      if (state.mode === 'listening') {
        stopListening();
        return;
      }
      if (state.speaking || state.mode === 'speaking') return;
      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        recognition.onresult = (e) => {
          let final = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
          }
          if (final) {
            stopListening();
            handleUser(final, 'voice');
          }
        };
        recognition.onend = () => {
          setMode('idle');
          state.listening = false;
        };
        recognition.onerror = () => {
          setMode('idle');
          state.listening = false;
        };
      }
      try {
        recognition.start();
        state.listening = true;
        setMode('listening');
      } catch (e) {
        recognition = null;
      }
    }

    function stopListening() {
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      state.listening = false;
    }

    // ---------- hands-free wake word ----------
    let wakeRecognition = null;

    function startWakeWord() {
      if (!state.handsFree || !SpeechRecognition) return;
      if (wakeRecognition) return;
      wakeRecognition = new SpeechRecognition();
      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = true;
      wakeRecognition.lang = 'en-US';
      wakeRecognition.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            const text = e.results[i][0].transcript.toLowerCase().trim();
            if (/\bhey winston\b/.test(text) || /\bhey Winston\b/.test(text)) {
              const afterWake = text.replace(/\bhey winston\b/i, '').trim();
              if (afterWake) {
                              handleUser(afterWake, 'voice');
                            } else {
                              listen();
                            }
            }
          }
                  }
                };
                wakeRecognition.onerror = () => { wakeRecognition = null; };
                try { wakeRecognition.start(); } catch (e) { wakeRecognition = null; }
              }

              function liveContext() {
                const now = new Date();
                return { role: 'system', content: 'Live system note — current local date/time: ' +
                  now.toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '.' };
              }

              // ---------- events ----------
                  els.mic.addEventListener('click', listen);
    if (els.composer) {
      els.composer.addEventListener('submit', (e) => {
        e.preventDefault();
        submitText(els.chatInput && els.chatInput.value);
      });
    }
    els.settingsBtn.addEventListener('click', openSettings);
    els.brand.addEventListener('click', openSettings);
    els.scrim.addEventListener('click', closeSettings);
    els.cancelBtn.addEventListener('click', closeSettings);
    els.saveBtn.addEventListener('click', saveSettings);
    els.cloudAuthBtn.addEventListener('click', async () => {
      els.cloudAuthBtn.disabled = true;
      try {
        if (hasCloudSession()) await cloud.signOut();
        else await cloud.signIn();
      } catch (error) {
        showToast((error && error.message) || 'Google sign-in failed');
      } finally {
        els.cloudAuthBtn.disabled = false;
        updateCloudUI();
      }
    });

    // ---------- ambient init ----------
        cloud.init().then(() => {
          // Cloud connected
        });
        els.chatInput && els.chatInput.focus();
    els.verTag.textContent = 'Winston v' + APP_VERSION;

    // ---------- startup ----------
    setTimeout(() => startWakeWord(), 2000);
  </script>
</body>
